[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music-recommender"
version = "1.0.0"
description = "Content-based music recommender on Spotify audio features, with offline evaluation and a Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
report = ["matplotlib>=3.8", "tabulate>=0.9"]
ranker = ["lightgbm>=4.0"]
notebook = ["matplotlib>=3.8", "jupyter", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.6", "music-recommender[app,report,ranker]"]

[project.scripts]
music-rec = "music_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`
